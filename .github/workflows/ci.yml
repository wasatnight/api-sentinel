name: API Sentinel checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-disposable-only
          POSTGRES_DB: sentinel_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sentinel_ci"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      SENTINEL_DATABASE_URL: postgresql+psycopg://postgres@127.0.0.1:5432/sentinel_ci
      SENTINEL_DB_PASSWORD: ci-disposable-only
      SENTINEL_TEST_DATABASE_URL: postgresql+psycopg://postgres:ci-disposable-only@127.0.0.1:5432/sentinel_ci
      SENTINEL_MONITORING_ENABLED: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: npm
      - run: python -m pip install -r backend/requirements.lock.txt
      - run: python -m alembic -c backend/alembic.ini upgrade head
      - run: python -m ruff check backend scripts
      - run: python -m pytest -q backend/tests
      - run: python -m alembic -c backend/alembic.ini check
      - run: npm ci
      - run: npm test
      - run: npm run build

      - run: npm audit --audit-level=high
